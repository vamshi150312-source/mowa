spring.application.name=mova
# The database password lives in backend/.env.db (DB_PASSWORD=...), which isn't committed.
spring.config.import=optional:file:./.env.db[.properties]

server.port=${PORT:8080}
# Only the Next.js dev server (on this computer) talks to this API; it proxies /api/*.
server.address=${BIND_ADDRESS:127.0.0.1}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/mova}
spring.datasource.username=${DB_USER:mova}
spring.datasource.password=${DB_PASSWORD}

# Photos up to 20 MB, videos up to 50 MB (checked per type in MediaStore).
spring.servlet.multipart.max-file-size=55MB
spring.servlet.multipart.max-request-size=56MB

# Shared with the old Node backend: data/uploads holds uploaded media, and data/db.json
# (if present) is imported into an empty database on first start.
mova.data-dir=${MOVA_DATA_DIR:../data}

server.error.whitelabel.enabled=false
